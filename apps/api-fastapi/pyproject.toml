[project]
name = "iwo3-api-fastapi"
version = "0.0.1"
description = "AIDEN IWO3 runtime API and channel gateway"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy>=2.0.36",
  "asyncpg>=0.30.0",
  "alembic>=1.14.0",
  "httpx>=0.28.0",
  "python-multipart>=0.0.20",
  "pynacl>=1.6.2",
  "mcp>=1.27.0",
  "pypdf>=6.10.2",
  "python-pptx>=1.0.2",
  "beautifulsoup4>=4.14.3",
  "chromadb>=1.5.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
