# gitleaks config for IWO3
# Invoked via:  gitleaks detect --no-banner --exit-code 1 --config .gitleaks.toml
#
# Policy (per IWO3_LOOP_1_PLAN §4.11, CODEX revision #5):
#   - Any credential-shaped field in fixtures/seeds must hold `credential_ref:`
#     or null. Anything else fails the scan.
#   - No .env files committed.
#   - No credential screenshots/docs (images/PDFs) of secrets.

title = "IWO3 gitleaks config"

[extend]
useDefault = true

# Custom rule: credential-shaped fields in JSON/YAML must hold a
# `credential_ref:` placeholder (or be JSON null — unquoted nulls are
# already excluded because the regex requires a quoted string value).
#
# RE2 note: gitleaks v8 uses the RE2 engine, which does NOT support
# Perl-style lookahead (`(?!...)`). Exclusions live in the rule
# allowlist below, not inside the pattern.
[[rules]]
id = "iwo3-fixture-credential-placeholder"
description = "Fixture/seed field with a credential-shaped name must hold credential_ref:"
regex = '''(?i)"(credential|token|api[_-]?key|secret|password|bearer|access[_-]?key|private[_-]?key|auth)"\s*:\s*"([^"]+)"'''
secretGroup = 2
path = '''(^|/)(db/(fixtures|seeds)/|tests/fixtures/).+\.(json|ya?ml)$'''
tags = ["iwo3", "fixtures"]

  [rules.allowlist]
  description = "Permit credential_ref: placeholder values (RE2-safe replacement for negative lookahead)"
  stopwords = ["credential_ref:"]

[allowlist]
description = "Allow Gamma template IDs and IWO3_* env-var-name string literals"
regexes = [
  # Gamma template IDs — operational identifiers, not credentials
  '''g_[a-z0-9]{15,}''',
  # IWO3_* env var NAMES referenced as string literals in source
  # (e.g. SIGNING_KEY_ENV_VAR = "IWO3_JWT_SIGNING_KEY"). The all-caps
  # IWO3_* shape is an identifier, not secret material. Real key values
  # are mixed case + symbols and never match this anchored pattern.
  '''^IWO3_[A-Z0-9_]+$''',
]

paths = [
  # Documentation may legitimately reference secret-shaped example text
  '''^docs/''',
  '''^WS024_IWO3\[Branch\]/''',
]
